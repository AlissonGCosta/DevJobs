spring:
  application:
    name: DevJobs
  # Banco em memoria para desenvolvimento local.
  datasource:
    url: jdbc:h2:mem:devjobs;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  jpa:
    hibernate:
      ddl-auto: update
  # O Hibernate cria as tabelas enquanto nao ha migrations para o H2.
  flyway:
    enabled: false
